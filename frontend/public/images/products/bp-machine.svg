<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="400" height="300" rx="20" fill="#f0f9ff"/>
  <g transform="translate(65, 45)">
    <!-- BP Monitor Base -->
    <rect x="20" y="20" width="120" height="135" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
    <!-- Large Backlit LCD Display -->
    <rect x="32" y="32" width="96" height="70" rx="8" fill="#0f172a"/>
    <text x="42" y="55" font-family="sans-serif" font-size="9" fill="#94a3b8">SYS</text>
    <text x="95" y="58" font-family="monospace" font-size="22" font-weight="bold" fill="#38bdf8">120</text>
    
    <text x="42" y="75" font-family="sans-serif" font-size="9" fill="#94a3b8">DIA</text>
    <text x="95" y="78" font-family="monospace" font-size="20" font-weight="bold" fill="#38bdf8">80</text>
    
    <text x="42" y="94" font-family="sans-serif" font-size="8" fill="#ef4444">PULSE</text>
    <text x="95" y="96" font-family="monospace" font-size="14" font-weight="bold" fill="#f87171">72</text>
    <!-- Start Button -->
    <rect x="45" y="115" width="70" height="26" rx="8" fill="#0284c7"/>
    <text x="80" y="132" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">START/STOP</text>
    <!-- Hose connector -->
    <path d="M 140 100 Q 170 120 180 80" fill="none" stroke="#64748b" stroke-width="8" stroke-linecap="round"/>
    <!-- Arm Cuff -->
    <rect x="180" y="35" width="85" height="105" rx="14" fill="#334155"/>
    <rect x="190" y="45" width="65" height="85" rx="8" fill="#1e293b"/>
    <text x="222" y="92" font-family="sans-serif" font-size="11" font-weight="bold" fill="#cbd5e1" text-anchor="middle">ARM CUFF</text>
    <text x="222" y="106" font-family="sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">22-42 cm</text>
  </g>
  <rect x="25" y="25" width="100" height="26" rx="6" fill="#e0f2fe"/>
  <text x="75" y="42" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0369a1" text-anchor="middle">DIGITAL BP</text>
  <text x="200" y="250" font-family="sans-serif" font-size="15" font-weight="bold" fill="#0c4a6e" text-anchor="middle">Digital Upper Arm Blood Pressure Monitor</text>
  <text x="200" y="270" font-family="sans-serif" font-size="12" fill="#0284c7" text-anchor="middle">Intellisense Accurate • Dual 99 Memory Log</text>
</svg>