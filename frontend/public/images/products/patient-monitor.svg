<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="400" height="300" rx="20" fill="#f8fafc"/>
  <g transform="translate(90, 45)">
    <!-- Main Chassis -->
    <rect x="20" y="20" width="180" height="135" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="3"/>
    <!-- Top Handle & Alarm Lamp -->
    <rect x="80" y="10" width="60" height="12" rx="4" fill="#475569"/>
    <rect x="95" y="12" width="30" height="6" rx="2" fill="#ef4444"/>
    <!-- 12.1 inch Color TFT Display -->
    <rect x="32" y="32" width="125" height="110" rx="6" fill="#020617"/>
    <!-- ECG Waveform (Green) -->
    <path d="M 38 60 L 55 60 L 60 45 L 65 75 L 70 55 L 75 60 L 110 60" fill="none" stroke="#22c55e" stroke-width="2"/>
    <text x="145" y="62" font-family="monospace" font-size="12" font-weight="bold" fill="#22c55e" text-anchor="end">HR 74</text>
    <!-- Pleth SpO2 Waveform (Cyan) -->
    <path d="M 38 85 Q 50 72 65 85 T 95 85 T 120 85" fill="none" stroke="#06b6d4" stroke-width="2"/>
    <text x="145" y="87" font-family="monospace" font-size="12" font-weight="bold" fill="#06b6d4" text-anchor="end">SpO2 99</text>
    <!-- NIBP Value (White) -->
    <text x="145" y="112" font-family="monospace" font-size="11" font-weight="bold" fill="#f8fafc" text-anchor="end">118/78</text>
    <text x="42" y="112" font-family="sans-serif" font-size="8" fill="#94a3b8">NIBP (mmHg)</text>
    <!-- Right Control Rotary Knob -->
    <circle cx="178" cy="65" r="10" fill="#334155"/>
    <circle cx="178" cy="95" r="6" fill="#0284c7"/>
    <circle cx="178" cy="115" r="6" fill="#64748b"/>
  </g>
  <rect x="25" y="25" width="115" height="26" rx="6" fill="#e2e8f0"/>
  <text x="82" y="42" font-family="sans-serif" font-size="12" font-weight="bold" fill="#334155" text-anchor="middle">MULTIPARA 12"</text>
  <text x="200" y="250" font-family="sans-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle">Multipara Patient Monitor 12.1-inch Screen</text>
  <text x="200" y="270" font-family="sans-serif" font-size="12" fill="#0284c7" text-anchor="middle">ECG • SpO2 • NIBP • Dual Temp • Arrhythmia Analysis</text>
</svg>

