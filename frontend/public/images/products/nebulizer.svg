<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="400" height="300" rx="20" fill="#f5f3ff"/>
  <g transform="translate(130, 45)">
    <!-- Nebulizer Handle/Body -->
    <rect x="40" y="60" width="60" height="100" rx="18" fill="#ffffff" stroke="#ddd6fe" stroke-width="3"/>
    <!-- Medicine Cup -->
    <rect x="45" y="25" width="50" height="40" rx="8" fill="#c4b5fd" fill-opacity="0.6" stroke="#8b5cf6" stroke-width="2"/>
    <!-- Mesh Disc Nozzle -->
    <circle cx="70" cy="45" r="10" fill="#6d28d9"/>
    <circle cx="70" cy="45" r="6" fill="#e0e7ff"/>
    <!-- Aerosol Mist Effect -->
    <circle cx="70" cy="15" r="5" fill="#a78bfa" opacity="0.6"/>
    <circle cx="60" cy="5" r="7" fill="#c4b5fd" opacity="0.5"/>
    <circle cx="85" cy="0" r="9" fill="#ddd6fe" opacity="0.4"/>
    <!-- Power Button -->
    <circle cx="70" cy="95" r="12" fill="#7c3aed"/>
    <circle cx="70" cy="95" r="6" fill="#ffffff"/>
    <!-- Battery indicator -->
    <rect x="62" y="125" width="16" height="6" rx="2" fill="#10b981"/>
  </g>
  <rect x="25" y="25" width="110" height="26" rx="6" fill="#ede9fe"/>
  <text x="80" y="42" font-family="sans-serif" font-size="12" font-weight="bold" fill="#6d28d9" text-anchor="middle">MESH NEBULIZER</text>
  <text x="200" y="250" font-family="sans-serif" font-size="15" font-weight="bold" fill="#4c1d95" text-anchor="middle">Portable Ultrasonic Mesh Nebulizer</text>
  <text x="200" y="270" font-family="sans-serif" font-size="12" fill="#7c3aed" text-anchor="middle">Silent Handheld • Adult &amp; Child Masks Included</text>
</svg>