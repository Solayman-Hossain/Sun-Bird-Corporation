<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="canBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf2f8"/>
      <stop offset="100%" stop-color="#fce7f3"/>
    </linearGradient>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>
    <linearGradient id="needleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="20" fill="url(#canBg)"/>
  <!-- Cannula Body -->
  <g transform="translate(40, 70)">
    <!-- Stainless steel needle -->
    <path d="M 240 75 L 320 75 L 320 81 L 240 81 Z" fill="url(#needleGrad)"/>
    <polygon points="320,75 335,78 320,81" fill="#64748b"/>
    <!-- Catheter sheath -->
    <rect x="200" y="73" width="50" height="10" rx="3" fill="#fbcfe8" stroke="#f472b6" stroke-width="1.5"/>
    <!-- Injection Port Hub (Pink 20G) -->
    <rect x="140" y="65" width="65" height="26" rx="6" fill="url(#pinkGrad)"/>
    <!-- Port Cap -->
    <rect x="160" y="45" width="25" height="20" rx="4" fill="#f43f5e"/>
    <circle cx="172.5" cy="45" r="7" fill="#fda4af"/>
    <!-- Wings (Pink Flexible) -->
    <path d="M 155 91 C 150 115, 120 120, 110 110 C 105 100, 125 91, 155 91 Z" fill="#f472b6" opacity="0.9"/>
    <path d="M 190 91 C 195 115, 225 120, 235 110 C 240 100, 220 91, 190 91 Z" fill="#f472b6" opacity="0.9"/>
    <!-- Flashback Chamber -->
    <rect x="80" y="68" width="60" height="20" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="90" y="73" width="30" height="10" rx="2" fill="#ef4444" opacity="0.75"/>
    <!-- Luer lock plug -->
    <rect x="60" y="70" width="20" height="16" rx="3" fill="#ec4899"/>
  </g>
  <!-- Text Badges -->
  <rect x="25" y="25" width="90" height="26" rx="6" fill="#f472b6" fill-opacity="0.2"/>
  <text x="70" y="42" font-family="sans-serif" font-size="12" font-weight="bold" fill="#be185d" text-anchor="middle">20G PINK</text>
  <text x="200" y="250" font-family="sans-serif" font-size="15" font-weight="bold" fill="#831843" text-anchor="middle">Sterile IV Cannula with Port &amp; Wings</text>
  <text x="200" y="270" font-family="sans-serif" font-size="12" fill="#9d174d" text-anchor="middle">Medical Consumable • NBR HS 90183900</text>
</svg>

