<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="400" height="300" rx="20" fill="#f1f5f9"/>
  <g transform="translate(130, 50)">
    <!-- Oximeter Body Shell -->
    <rect x="20" y="20" width="95" height="130" rx="22" fill="#ffffff" stroke="#94a3b8" stroke-width="3"/>
    <!-- Hinge Clip line -->
    <line x1="20" y1="90" x2="115" y2="90" stroke="#e2e8f0" stroke-width="2"/>
    <!-- OLED Screen -->
    <rect x="30" y="32" width="75" height="52" rx="8" fill="#020617"/>
    <text x="45" y="50" font-family="sans-serif" font-size="9" fill="#38bdf8">%SpO2</text>
    <text x="45" y="72" font-family="monospace" font-size="20" font-weight="bold" fill="#38bdf8">99</text>
    
    <text x="82" y="50" font-family="sans-serif" font-size="9" fill="#eab308">PR bpm</text>
    <text x="82" y="72" font-family="monospace" font-size="20" font-weight="bold" fill="#eab308">75</text>
    <!-- Plethysmograph Waveform Line -->
    <path d="M 35 78 L 48 78 L 52 74 L 56 81 L 60 76 L 68 78 L 95 78" fill="none" stroke="#22c55e" stroke-width="1.5"/>
    <!-- Power Button -->
    <circle cx="67" cy="118" r="12" fill="#0284c7"/>
    <circle cx="67" cy="118" r="5" fill="#ffffff"/>
  </g>
  <rect x="25" y="25" width="110" height="26" rx="6" fill="#e2e8f0"/>
  <text x="80" y="42" font-family="sans-serif" font-size="12" font-weight="bold" fill="#334155" text-anchor="middle">PULSE OXIMETER</text>
  <text x="200" y="250" font-family="sans-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle">Fingertip Pulse Oximeter SpO2 Monitor</text>
  <text x="200" y="270" font-family="sans-serif" font-size="12" fill="#475569" text-anchor="middle">Dual-Color OLED Display • Blood Oxygen &amp; Pulse</text>
</svg>