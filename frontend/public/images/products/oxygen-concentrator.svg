<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="400" height="300" rx="20" fill="#f0fdf4"/>
  <g transform="translate(125, 40)">
    <!-- Tower Body -->
    <rect x="20" y="20" width="110" height="150" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
    <!-- Top Handle Recess -->
    <rect x="45" y="10" width="60" height="14" rx="4" fill="#0f172a"/>
    <!-- Display Screen -->
    <rect x="35" y="40" width="80" height="36" rx="6" fill="#064e3b"/>
    <text x="75" y="62" font-family="monospace" font-size="14" font-weight="bold" fill="#34d399" text-anchor="middle">93.5% O2</text>
    <text x="75" y="72" font-family="sans-serif" font-size="8" fill="#a7f3d0" text-anchor="middle">10.0 L/MIN</text>
    <!-- Humidifier Bottle Cavity -->
    <rect x="35" y="90" width="40" height="60" rx="8" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2"/>
    <path d="M 40 125 Q 55 120 70 125" stroke="#0284c7" stroke-width="2" fill="none"/>
    <!-- Flowmeter Knob -->
    <circle cx="95" cy="105" r="10" fill="#334155"/>
    <rect x="93" y="120" width="4" height="20" rx="2" fill="#64748b"/>
    <!-- Bottom Castors -->
    <circle cx="35" cy="178" r="8" fill="#1e293b"/>
    <circle cx="115" cy="178" r="8" fill="#1e293b"/>
  </g>
  <rect x="25" y="25" width="100" height="26" rx="6" fill="#dcfce7"/>
  <text x="75" y="42" font-family="sans-serif" font-size="12" font-weight="bold" fill="#166534" text-anchor="middle">10L OXYGEN</text>
  <text x="200" y="250" font-family="sans-serif" font-size="15" font-weight="bold" fill="#064e3b" text-anchor="middle">10L Medical Oxygen Concentrator 93%</text>
  <text x="200" y="270" font-family="sans-serif" font-size="12" fill="#15803d" text-anchor="middle">Continuous High-Flow Therapy • French CE & DGDA Approved</text>
</svg>

