<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="400" height="300" rx="20" fill="#eff6ff"/>
  <g transform="translate(60, 60)">
    <!-- Elastic Band Loop -->
    <path d="M 40 100 C 40 40, 200 40, 240 80 C 270 110, 250 160, 200 160 C 120 160, 60 140, 40 100 Z" fill="none" stroke="#2563eb" stroke-width="26" stroke-linecap="round"/>
    <path d="M 60 100 C 60 50, 180 50, 220 85 C 245 110, 230 150, 190 150" fill="none" stroke="#60a5fa" stroke-width="4" stroke-dasharray="8 6"/>
    <!-- Plastic Buckle -->
    <rect x="180" y="70" width="60" height="45" rx="10" fill="#1e3a8a"/>
    <rect x="195" y="78" width="30" height="12" rx="4" fill="#ffffff"/>
    <!-- Quick Release Button -->
    <rect x="225" y="80" width="22" height="25" rx="5" fill="#ef4444"/>
    <circle cx="236" cy="92.5" r="4" fill="#ffffff"/>
  </g>
  <rect x="25" y="25" width="110" height="26" rx="6" fill="#bfdbfe"/>
  <text x="80" y="42" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1e40af" text-anchor="middle">QUICK-RELEASE</text>
  <text x="200" y="250" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Medical Elastic Tourniquet</text>
  <text x="200" y="270" font-family="sans-serif" font-size="12" fill="#3b82f6" text-anchor="middle">Durable Buckle • Phlebotomy &amp; First Aid</text>
</svg>