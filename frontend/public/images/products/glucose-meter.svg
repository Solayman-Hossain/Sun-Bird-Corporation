<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="400" height="300" rx="20" fill="#fef2f2"/>
  <g transform="translate(100, 45)">
    <!-- Glucose Meter Device Body -->
    <rect x="20" y="20" width="85" height="135" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
    <!-- LCD Screen -->
    <rect x="30" y="35" width="65" height="50" rx="8" fill="#1e293b"/>
    <text x="62" y="66" font-family="monospace" font-size="20" font-weight="bold" fill="#22c55e" text-anchor="middle">5.6</text>
    <text x="62" y="79" font-family="sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">mmol/L</text>
    <!-- Blood Drop Icon -->
    <circle cx="83" cy="45" r="4" fill="#ef4444"/>
    <!-- Strip Port with inserted Test Strip -->
    <rect x="52" y="145" width="20" height="30" rx="3" fill="#e2e8f0" stroke="#94a3b8"/>
    <rect x="57" y="165" width="10" height="8" fill="#ef4444"/>
    <!-- Main Center Navigation Button -->
    <circle cx="62" cy="112" r="14" fill="#0284c7"/>
    <circle cx="62" cy="112" r="7" fill="#ffffff"/>
    
    <!-- Strips Vial Bottle -->
    <rect x="125" y="60" width="55" height="90" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
    <rect x="120" y="48" width="65" height="16" rx="4" fill="#0284c7"/>
    <rect x="130" y="75" width="45" height="30" fill="#ef4444" fill-opacity="0.1"/>
    <text x="152" y="93" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ef4444" text-anchor="middle">50 STRIPS</text>
  </g>
  <rect x="25" y="25" width="110" height="26" rx="6" fill="#fee2e2"/>
  <text x="80" y="42" font-family="sans-serif" font-size="12" font-weight="bold" fill="#b91c1c" text-anchor="middle">GLUCOSE KIT</text>
  <text x="200" y="250" font-family="sans-serif" font-size="15" font-weight="bold" fill="#991b1b" text-anchor="middle">Digital Blood Glucose Monitoring System</text>
  <text x="200" y="270" font-family="sans-serif" font-size="12" fill="#dc2626" text-anchor="middle">Fast 5-Second Test • 50 Strips &amp; Lancets</text>
</svg>