<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="400" height="300" rx="20" fill="#f0fdfa"/>
  <g transform="translate(105, 45)">
    <!-- Main Trolley Frame -->
    <rect x="20" y="20" width="150" height="135" rx="14" fill="#ffffff" stroke="#0d9488" stroke-width="3"/>
    <!-- Dual Glass Suction Jars (2500ml each) -->
    <rect x="35" y="45" width="45" height="75" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <path d="M 37 85 Q 57 80 78 85" stroke="#38bdf8" stroke-width="2" fill="none"/>
    <rect x="90" y="45" width="45" height="75" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <path d="M 92 85 Q 112 80 133 85" stroke="#38bdf8" stroke-width="2" fill="none"/>
    <!-- Vacuum Meter Gauge -->
    <circle cx="148" cy="55" r="12" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
    <line x1="148" y1="55" x2="154" y2="50" stroke="#ef4444" stroke-width="2"/>
    <!-- Suction Tubing -->
    <path d="M 57 45 Q 60 25 90 25 T 160 45" stroke="#94a3b8" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- Power Switch & Foot Switch Connector -->
    <rect x="142" y="80" width="16" height="20" rx="3" fill="#14b8a6"/>
    <!-- Castor Wheels -->
    <circle cx="45" cy="165" r="8" fill="#1e293b"/>
    <circle cx="145" cy="165" r="8" fill="#1e293b"/>
  </g>
  <rect x="25" y="25" width="125" height="26" rx="6" fill="#ccfbf1"/>
  <text x="87" y="42" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0f766e" text-anchor="middle">ELECTRIC SUCTION</text>
  <text x="200" y="250" font-family="sans-serif" font-size="15" font-weight="bold" fill="#134e4a" text-anchor="middle">Electric Phlegm & Surgical Suction Apparatus</text>
  <text x="200" y="270" font-family="sans-serif" font-size="12" fill="#0d9488" text-anchor="middle">Oil-Free Vacuum Pump • Dual 2500ml Polycarbonate Jars</text>
</svg>

