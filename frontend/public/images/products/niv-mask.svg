<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="400" height="300" rx="20" fill="#f8fafc"/>
  <g transform="translate(110, 45)">
    <!-- Headgear straps -->
    <path d="M 20 40 Q -10 90 10 140" fill="none" stroke="#0284c7" stroke-width="12" stroke-linecap="round"/>
    <path d="M 160 40 Q 190 90 170 140" fill="none" stroke="#0284c7" stroke-width="12" stroke-linecap="round"/>
    <path d="M 20 40 L 160 40" fill="none" stroke="#0369a1" stroke-width="10"/>
    <!-- Mask Silicone Body -->
    <path d="M 50 40 Q 90 15 130 40 Q 155 90 140 135 Q 90 160 40 135 Q 25 90 50 40 Z" fill="#e0f2fe" stroke="#38bdf8" stroke-width="4" fill-opacity="0.85"/>
    <!-- Clear Dome Front -->
    <path d="M 65 55 Q 90 40 115 55 Q 130 90 120 120 Q 90 135 60 120 Q 50 90 65 55 Z" fill="#ffffff" fill-opacity="0.9" stroke="#bae6fd" stroke-width="2"/>
    <!-- 360-degree Elbow connector -->
    <circle cx="90" cy="95" r="18" fill="#0284c7"/>
    <circle cx="90" cy="95" r="10" fill="#e0f2fe"/>
    <rect x="84" y="95" width="12" height="26" rx="4" fill="#0369a1"/>
  </g>
  <rect x="25" y="25" width="120" height="26" rx="6" fill="#e0f2fe"/>
  <text x="85" y="42" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0369a1" text-anchor="middle">FULL FACE NIV</text>
  <text x="200" y="250" font-family="sans-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle">NIV Full Face CPAP/BiPAP Mask</text>
  <text x="200" y="270" font-family="sans-serif" font-size="12" fill="#0284c7" text-anchor="middle">Ultra-soft Silicone • Anti-Asphyxia Valve</text>
</svg>