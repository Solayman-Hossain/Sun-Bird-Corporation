<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="400" height="300" rx="20" fill="#fffbeb"/>
  <g transform="translate(130, 40)">
    <!-- Infrared Gun Thermometer Body -->
    <path d="M 40 40 L 95 30 L 105 80 L 80 85 L 75 140 L 35 140 L 40 85 L 15 80 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
    <!-- Infrared Sensor Tip -->
    <rect x="95" y="35" width="16" height="35" rx="4" fill="#334155"/>
    <circle cx="108" cy="52" r="4" fill="#ef4444"/>
    <!-- LCD Backlit Screen -->
    <rect x="30" y="48" width="45" height="30" rx="6" fill="#10b981"/>
    <text x="52" y="69" font-family="monospace" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">98.6°F</text>
    <!-- Trigger Button -->
    <path d="M 35 95 Q 22 105 35 115" fill="none" stroke="#f59e0b" stroke-width="6" stroke-linecap="round"/>
    <!-- Blue/Green accents -->
    <rect x="42" y="125" width="26" height="8" rx="2" fill="#0284c7"/>
  </g>
  <rect x="25" y="25" width="125" height="26" rx="6" fill="#fef3c7"/>
  <text x="87" y="42" font-family="sans-serif" font-size="12" font-weight="bold" fill="#b45309" text-anchor="middle">INFRARED TOUCHLESS</text>
  <text x="200" y="250" font-family="sans-serif" font-size="15" font-weight="bold" fill="#78350f" text-anchor="middle">Non-Contact Infrared Forehead Thermometer</text>
  <text x="200" y="270" font-family="sans-serif" font-size="12" fill="#d97706" text-anchor="middle">1-Second Instant Reading • 3-Color Backlight</text>
</svg>