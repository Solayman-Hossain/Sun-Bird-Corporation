<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="400" height="300" rx="20" fill="#f0fdf4"/>
  <g transform="translate(60, 50)">
    <!-- Main DB-15 Connector Hub -->
    <rect x="30" y="70" width="60" height="40" rx="8" fill="#334155"/>
    <rect x="20" y="78" width="14" height="24" rx="3" fill="#cbd5e1"/>
    <!-- Trunk Cable -->
    <path d="M 90 90 Q 140 90 160 90" fill="none" stroke="#475569" stroke-width="12" stroke-linecap="round"/>
    <!-- Distribution Yoke -->
    <rect x="160" y="65" width="35" height="50" rx="6" fill="#1e293b"/>
    <!-- 5 Lead Wires Spreading -->
    <path d="M 195 75 Q 230 40 260 40" fill="none" stroke="#ef4444" stroke-width="4"/>
    <circle cx="265" cy="40" r="8" fill="#ef4444"/><text x="265" y="44" font-family="sans-serif" font-size="10" fill="#fff" font-weight="bold" text-anchor="middle">R</text>
    
    <path d="M 195 82 Q 230 65 260 65" fill="none" stroke="#eab308" stroke-width="4"/>
    <circle cx="265" cy="65" r="8" fill="#eab308"/><text x="265" y="69" font-family="sans-serif" font-size="10" fill="#000" font-weight="bold" text-anchor="middle">L</text>
    
    <path d="M 195 90 L 260 90" fill="none" stroke="#22c55e" stroke-width="4"/>
    <circle cx="265" cy="90" r="8" fill="#22c55e"/><text x="265" y="94" font-family="sans-serif" font-size="10" fill="#fff" font-weight="bold" text-anchor="middle">F</text>
    
    <path d="M 195 98 Q 230 115 260 115" fill="none" stroke="#94a3b8" stroke-width="4"/>
    <circle cx="265" cy="115" r="8" fill="#64748b"/><text x="265" y="119" font-family="sans-serif" font-size="10" fill="#fff" font-weight="bold" text-anchor="middle">N</text>
    
    <path d="M 195 105 Q 230 140 260 140" fill="none" stroke="#8b5cf6" stroke-width="4"/>
    <circle cx="265" cy="140" r="8" fill="#8b5cf6"/><text x="265" y="144" font-family="sans-serif" font-size="10" fill="#fff" font-weight="bold" text-anchor="middle">C</text>
  </g>
  <rect x="25" y="25" width="100" height="26" rx="6" fill="#bbf7d0"/>
  <text x="75" y="42" font-family="sans-serif" font-size="12" font-weight="bold" fill="#15803d" text-anchor="middle">10-LEAD ECG</text>
  <text x="200" y="250" font-family="sans-serif" font-size="15" font-weight="bold" fill="#14532d" text-anchor="middle">10-Lead Universal ECG Patient Cable</text>
  <text x="200" y="270" font-family="sans-serif" font-size="12" fill="#16a34a" text-anchor="middle">Noise Shielded • Banana Pin / Snap Connector</text>
</svg>