<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="400" height="300" rx="20" fill="#f8fafc"/>
  <g transform="translate(50, 60)">
    <!-- Bed Frame & Rails -->
    <rect x="20" y="80" width="260" height="20" rx="6" fill="#0f766e"/>
    <!-- Mattress -->
    <rect x="25" y="60" width="250" height="22" rx="8" fill="#14b8a6"/>
    <!-- Elevated Backrest -->
    <path d="M 30 60 L 95 25 L 105 38 L 40 70 Z" fill="#0d9488"/>
    <!-- Side Safety Railings -->
    <rect x="115" y="38" width="65" height="24" rx="4" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/>
    <rect x="195" y="38" width="65" height="24" rx="4" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/>
    <!-- Headboard & Footboard -->
    <rect x="10" y="30" width="16" height="75" rx="6" fill="#334155"/>
    <rect x="274" y="45" width="16" height="60" rx="6" fill="#334155"/>
    <!-- Bed Legs & Castor Wheels -->
    <rect x="40" y="100" width="12" height="35" rx="2" fill="#475569"/>
    <circle cx="46" cy="142" r="10" fill="#1e293b"/>
    <circle cx="46" cy="142" r="4" fill="#94a3b8"/>
    
    <rect x="248" y="100" width="12" height="35" rx="2" fill="#475569"/>
    <circle cx="254" cy="142" r="10" fill="#1e293b"/>
    <circle cx="254" cy="142" r="4" fill="#94a3b8"/>
    <!-- Electric Actuator Controls -->
    <rect x="145" y="102" width="20" height="15" rx="3" fill="#0284c7"/>
  </g>
  <rect x="25" y="25" width="120" height="26" rx="6" fill="#ccfbf1"/>
  <text x="85" y="42" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0f766e" text-anchor="middle">5-FUNCTION ICU</text>
  <text x="200" y="250" font-family="sans-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle">Electric 5-Function ICU Hospital Bed</text>
  <text x="200" y="270" font-family="sans-serif" font-size="12" fill="#0d9488" text-anchor="middle">CPR Quick Release • Medical Grade Antibacterial Mattress</text>
</svg>

