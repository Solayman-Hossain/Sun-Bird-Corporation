<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="400" height="300" rx="20" fill="#fefce8"/>
  <g transform="translate(100, 40)">
    <!-- Backrest & Seat -->
    <rect x="75" y="40" width="14" height="75" rx="5" fill="#3b82f6"/>
    <rect x="85" y="100" width="70" height="15" rx="4" fill="#1d4ed8"/>
    <!-- Push Handle -->
    <path d="M 75 45 L 50 45" stroke="#1e293b" stroke-width="8" stroke-linecap="round"/>
    <!-- Metal Frame Structure -->
    <path d="M 78 80 L 145 130 L 175 130" stroke="#475569" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M 85 110 L 85 145" stroke="#475569" stroke-width="7" fill="none"/>
    <!-- Large Rear Wheel -->
    <circle cx="85" cy="145" r="45" fill="none" stroke="#0f172a" stroke-width="8"/>
    <circle cx="85" cy="145" r="40" fill="none" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="85" cy="145" r="8" fill="#3b82f6"/>
    <!-- Front Small Castor Wheel -->
    <rect x="170" y="130" width="6" height="25" rx="2" fill="#475569"/>
    <circle cx="173" cy="160" r="14" fill="#0f172a"/>
    <circle cx="173" cy="160" r="4" fill="#ffffff"/>
    <!-- Footrest -->
    <rect x="175" y="150" width="25" height="6" rx="2" fill="#1e293b"/>
  </g>
  <rect x="25" y="25" width="110" height="26" rx="6" fill="#fef08a"/>
  <text x="80" y="42" font-family="sans-serif" font-size="12" font-weight="bold" fill="#854d0e" text-anchor="middle">COMMODE CHAIR</text>
  <text x="200" y="250" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1e293b" text-anchor="middle">Lightweight Foldable Commode Wheelchair</text>
  <text x="200" y="270" font-family="sans-serif" font-size="12" fill="#ca8a04" text-anchor="middle">Chromium Steel Frame • Removable Cushion & Pot</text>
</svg>

