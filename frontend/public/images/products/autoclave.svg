<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="400" height="300" rx="20" fill="#f5f3ff"/>
  <g transform="translate(110, 45)">
    <!-- Autoclave Body -->
    <rect x="20" y="20" width="140" height="135" rx="14" fill="#ffffff" stroke="#a78bfa" stroke-width="3"/>
    <!-- Circular Stainless Steel Chamber Door -->
    <circle cx="80" cy="88" r="48" fill="#e2e8f0" stroke="#64748b" stroke-width="4"/>
    <circle cx="80" cy="88" r="38" fill="#cbd5e1" stroke="#94a3b8" stroke-width="2"/>
    <!-- Door Locking Wheel Handles -->
    <circle cx="80" cy="88" r="14" fill="#1e293b"/>
    <rect x="76" y="55" width="8" height="66" rx="3" fill="#334155"/>
    <rect x="47" y="84" width="66" height="8" rx="3" fill="#334155"/>
    <!-- Pressure Gauge -->
    <circle cx="138" cy="50" r="14" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
    <line x1="138" y1="50" x2="144" y2="44" stroke="#ef4444" stroke-width="2"/>
    <!-- Digital Temp Display -->
    <rect x="122" y="75" width="32" height="18" rx="4" fill="#0f172a"/>
    <text x="138" y="88" font-family="monospace" font-size="9" font-weight="bold" fill="#a78bfa" text-anchor="middle">134°C</text>
    <!-- Start Button -->
    <rect x="124" y="110" width="28" height="20" rx="5" fill="#7c3aed"/>
    <text x="138" y="124" font-family="sans-serif" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">RUN</text>
  </g>
  <rect x="25" y="25" width="125" height="26" rx="6" fill="#ede9fe"/>
  <text x="87" y="42" font-family="sans-serif" font-size="12" font-weight="bold" fill="#6d28d9" text-anchor="middle">24L AUTOCLAVE</text>
  <text x="200" y="250" font-family="sans-serif" font-size="15" font-weight="bold" fill="#4c1d95" text-anchor="middle">Tabletop Steam Autoclave Sterilizer 24L</text>
  <text x="200" y="270" font-family="sans-serif" font-size="12" fill="#7c3aed" text-anchor="middle">Class B Vacuum Sterilization • Surgical & Dental Instruments</text>
</svg>

