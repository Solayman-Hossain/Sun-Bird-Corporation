<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="400" height="300" rx="20" fill="#fff7ed"/>
  <g transform="translate(60, 50)">
    <!-- Foley Catheter Tube Loop -->
    <path d="M 50 140 C 30 50, 200 40, 220 120 S 140 180, 70 140" fill="none" stroke="#f59e0b" stroke-width="12" stroke-linecap="round"/>
    <path d="M 50 140 C 30 50, 200 40, 220 120 S 140 180, 70 140" fill="none" stroke="#fbbf24" stroke-width="6" stroke-linecap="round"/>
    <!-- Catheter Tip with Eyelet & Deflated Balloon -->
    <ellipse cx="48" cy="140" rx="8" ry="12" fill="#d97706"/>
    <circle cx="48" cy="140" r="3" fill="#451a03"/>
    <!-- 2-Way Funnel Valves -->
    <g transform="translate(180, 100) rotate(40)">
      <!-- Drainage Port -->
      <path d="M 20 20 L 50 10 L 50 30 Z" fill="#d97706"/>
      <!-- Inflation Port with Color Coded Valve (Orange 16Fr) -->
      <path d="M 20 30 L 45 45 L 40 55 Z" fill="#ea580c"/>
      <circle cx="45" cy="50" r="5" fill="#f97316"/>
    </g>
  </g>
  <rect x="25" y="25" width="130" height="26" rx="6" fill="#ffedd5"/>
  <text x="90" y="42" font-family="sans-serif" font-size="12" font-weight="bold" fill="#c2410c" text-anchor="middle">2-WAY FOLEY 16FR</text>
  <text x="200" y="250" font-family="sans-serif" font-size="15" font-weight="bold" fill="#7c2d12" text-anchor="middle">2-Way Siliconized Latex Foley Catheter</text>
  <text x="200" y="270" font-family="sans-serif" font-size="12" fill="#ea580c" text-anchor="middle">Hydrophilic Coated • Symmetrical 30ml Retention Balloon</text>
</svg>

