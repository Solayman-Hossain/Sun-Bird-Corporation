user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging settings
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time ut=$upstream_response_time';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        application/json
        application/javascript
        application/x-javascript
        text/javascript
        text/css
        text/plain
        text/xml
        application/xml
        application/xml+rss
        image/svg+xml;

    # Rate Limiting Zones (Prompt 55: public_zone 120r/m, erp_zone 300r/m)
    limit_req_zone $binary_remote_addr zone=public_zone:10m rate=120r/m;
    limit_req_zone $binary_remote_addr zone=erp_zone:10m rate=300r/m;
    limit_req_status 429;

    # Upstream Node.js API cluster
    upstream erp_backend {
        server api:5000;
        keepalive 32;
    }

    # HTTP server (Redirect to HTTPS or serve direct in local/staging)
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # Client body limit for multipart uploads (PO docs, Mushak PDFs, invoices)
        client_max_body_size 25M;

        # Security Headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self';" always;

        # Healthcheck endpoint (no rate limit for load balancers)
        location = /api/v1/health {
            proxy_pass http://erp_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Public Auth & Customer endpoints (120 req/min limit)
        location ~ ^/api/v1/auth/ {
            limit_req zone=public_zone burst=20 nodelay;
            proxy_pass http://erp_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Webhook endpoints (SSLCOMMERZ, Pathao, Steadfast)
        location ~ ^/api/v1/webhooks/ {
            limit_req zone=erp_zone burst=30 nodelay;
            proxy_pass http://erp_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Core ERP Protected API Endpoints (300 req/min limit)
        location /api/v1/ {
            limit_req zone=erp_zone burst=50 nodelay;
            proxy_pass http://erp_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Fallback for undefined routes
        location / {
            return 404 '{"success":false,"error":{"code":"NOT_FOUND","message":"Sun Bird Corporation ERP API gateway endpoint not found"}}';
            add_header Content-Type application/json;
        }
    }
}
